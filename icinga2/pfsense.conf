/*
 * Icinga 2 example configuration for check_pfsense
 *
 * Services are checked through NRPE with the "nrpe" CheckCommand of the
 * Icinga Template Library (ITL). Every check calls an NRPE command with
 * fixed arguments defined on the firewall (Services > NRPE), named
 * check_pfsense_<subcommand> with "-" replaced by "_" (example:
 * gateway-groups -> check_pfsense_gateway_groups). See README.md.
 *
 * Host variables:
 *
 *   vars.os = "pfSense"            required: enables the apply rules
 *   vars.pfsense_checks = [ ... ]  subcommands to check (default:
 *                                  PfSenseDefaultChecks); "carp" is
 *                                  handled by vars.carp_role
 *   vars.carp_role = "master"      CARP check expecting this role:
 *                                  "master", "backup" or "any"; no CARP
 *                                  check without this variable
 *   vars.pfsense_nrpe_timeout = 30 NRPE timeout in seconds (default 30)
 *
 * Author: Mattia Martinello <mattia@mattiamartinello.com>
 */

/* Subcommands checked when the host does not set vars.pfsense_checks */
const PfSenseDefaultChecks = [
  "gateways",
  "services",
  "interfaces",
  "states",
  "mbuf",
  "memory",
  "ntp",
  "certificates",
  "notices",
  "crash",
  "updates"
]

/* Subcommands checked on the host (without "carp") */
globals.pfsense_checks = function(host) {
  var checks = PfSenseDefaultChecks
  if (typeof(host.vars.pfsense_checks) == Array) {
    checks = host.vars.pfsense_checks
  }
  return checks.filter(check => check != "carp")
}

/* Common settings of the pfSense services */
template Service "pfsense-nrpe-service" {
  import "generic-service"

  check_command = "nrpe"
  check_interval = 5m
  retry_interval = 1m

  vars.nrpe_timeout = 30
}

/* One service per subcommand of vars.pfsense_checks */
apply Service "pfsense-" for (check in pfsense_checks(host)) {
  import "pfsense-nrpe-service"

  display_name = "pfSense " + check
  vars.nrpe_command = "check_pfsense_" + check.replace("-", "_")
  vars.pfsense_check = check
  if (host.vars.pfsense_nrpe_timeout) {
    vars.nrpe_timeout = host.vars.pfsense_nrpe_timeout
  }

  /* Slow checks or values that change slowly */
  if (check == "updates") {
    /* pkg-static update can take a while: the NRPE command uses -t 50 */
    check_interval = 1h
    retry_interval = 15m
    vars.nrpe_timeout = 60
  } else if (check == "certificates") {
    check_interval = 6h
    retry_interval = 30m
  } else if (check == "speedtest") {
    check_interval = 30m
  } else if (check in [ "notices", "crash" ]) {
    check_interval = 15m
  }

  assign where host.vars.os == "pfSense"
}

/*
 * CARP: the expected role is chosen with vars.carp_role and needs these
 * NRPE commands on the firewall:
 *   check_pfsense_carp_master  ->  carp --expect master
 *   check_pfsense_carp_backup  ->  carp --expect backup
 *   check_pfsense_carp_any     ->  carp --expect any
 */
apply Service "pfsense-carp" {
  import "pfsense-nrpe-service"

  display_name = "pfSense carp"
  vars.nrpe_command = "check_pfsense_carp_" + host.vars.carp_role
  vars.pfsense_check = "carp"
  if (host.vars.pfsense_nrpe_timeout) {
    vars.nrpe_timeout = host.vars.pfsense_nrpe_timeout
  }

  assign where host.vars.os == "pfSense" && host.vars.carp_role in [ "master", "backup", "any" ]
}

/*
 * Example hosts
 *

object Host "fw01" {
  import "generic-host"

  address = "192.0.2.1"
  vars.os = "pfSense"
  vars.carp_role = "master"
  vars.pfsense_checks = [
    "gateways", "gateway-groups", "services", "openvpn", "ipsec",
    "interfaces", "states", "mbuf", "memory", "zfs", "temperature",
    "ntp", "certificates", "notices", "crash", "updates"
  ]
}

object Host "fw02" {
  import "generic-host"

  address = "192.0.2.2"
  vars.os = "pfSense"
  vars.carp_role = "backup"
  // Default checks (PfSenseDefaultChecks)
}

object Host "fw-branch" {
  import "generic-host"

  address = "198.51.100.1"
  vars.os = "pfSense"
  vars.pfsense_checks = [ "gateways", "services", "wireguard", "dns", "speedtest" ]
  vars.pfsense_nrpe_timeout = 45
}

 */
